services:
  backend:
    build: ./backend
    container_name: skillquest-backend
    environment:
      APP_NAME: SkillQuest
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/skillquest.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - skillquest_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build: ./bot
    container_name: skillquest-bot
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      SKILLQUEST_API: http://backend:8000
      SKILLQUEST_API_TOKEN: ${SERVICE_API_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: skillquest-caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-hostmaster@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  skillquest_data:
  caddy_data:
  caddy_config:
