openapi: 3.1.0
info:
  title: SkillQuest
  description: 'Игровой бэкенд SkillQuest: диагностика навыков, игровые миссии, рекомендации
    курсов и стажировок, анализ резюме. Защищённые операции требуют Bearer-токен (см.
    security и docs/API.md).'
  contact:
    name: SkillQuest Team
    url: https://github.com/BrainL4g/max-edu-2026
  version: 0.2.0
servers:
- url: /
paths:
  /users:
    post:
      tags:
      - users
      summary: Create User
      description: Создание пользователя (доступно любому аутентифицированному).
      operationId: create_user_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Нет или невалидный Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /users/by-max:
    post:
      tags:
      - users
      summary: Get Or Create By Max
      description: 'Связка пользователя MAX: get-or-create по max_user_id (только
        service).'
      operationId: get_or_create_by_max_users_by_max_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserByMaxIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Нет или невалидный Bearer-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: 'Доступ запрещён: не свой ресурс или не та роль'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
