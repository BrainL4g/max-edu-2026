[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillquest-backend"
version = "0.1.0"
description = "Backend игровой платформы SkillQuest: диагностика навыков, миссии, рекомендации курсов и стажировок, анализ резюме."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.14",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ruff>=0.6",
    "PyYAML>=6",
    "openapi-spec-validator>=0.7",
]

[tool.setuptools.packages.find]
# пакет backend/ лежит уровнем выше pyproject.toml (backend/)
where = [".."]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["alembic/env.py"]
known_first_party = ["backend"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["backend/tests/", "backend/alembic/"]

[tool.coverage.run]
source = ["backend.app"]
omit = ["*/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.per-file-ignores]
# ассоциации SQLAlchemy объявлены строковыми аннотациями (future annotations)
"app/domain/*.py" = ["F821"]
# models импортируется ради регистрации в metadata (side effect)
"app/database/session.py" = ["F401"]
# длинные строки в автогенерируемых миграциях
"alembic/versions/*.py" = ["E501"]
# длинные строки в демо-данных (сценарии, описания)
"app/seed.py" = ["E501"]
# bootstrap sys.path до импортов приложения
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"