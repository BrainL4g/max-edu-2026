[project]
name = "skillquest-backend"
version = "0.1.0"
description = "Backend игровой платформы SkillQuest: диагностика навыков, миссии, рекомендации курсов и стажировок, анализ резюме."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.14",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# ассоциации SQLAlchemy объявлены строковыми аннотациями (future annotations)
"app/domain/*.py" = ["F821"]
# models импортируется ради регистрации в metadata (side effect)
"app/database/session.py" = ["F401"]
# длинные строки в автогенерируемых миграциях
"alembic/versions/*.py" = ["E501"]
# длинные строки в демо-данных (сценарии, описания)
"app/seed.py" = ["E501"]
# bootstrap sys.path до импортов приложения
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"